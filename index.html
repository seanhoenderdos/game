<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A jumping game built with vanilla JavaScript." />
    <title>Jumping Game</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/game.css" />
    <link rel="stylesheet" href="./css/hud.css" />
    <link rel="stylesheet" href="./css/player.css" />
    <link rel="stylesheet" href="./css/obstacles.css" />
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <main class="game-page">
      <header class="game-hud">
        <div>
          <h1 class="game-title">Jumping Game</h1>
          <p id="game-instructions" class="game-instructions">
            Jump over obstacles to earn points. A collision ends your run.
          </p>
        </div>

        <p class="game-score">
          <span class="game-score-label">Score</span>
          <span id="score" class="game-score-value">0</span>
        </p>
      </header>

      <section id="game-area" class="game-area" aria-label="Game area">
        <div id="player" class="player-character"></div>
        <div id="obstacle-layer" class="obstacle-layer" aria-hidden="true"></div>
        <div class="game-ground" aria-hidden="true"></div>
      </section>

      <section
        id="game-over"
        class="game-over"
        aria-labelledby="game-over-title"
        tabindex="-1"
        hidden
      >
        <h2 id="game-over-title" class="game-over-title">Game over</h2>
        <p class="game-final-score">Final score: <span id="final-score">0</span></p>
        <button id="restart-btn" class="game-restart" type="button">Play again</button>
      </section>

      <noscript>This game needs JavaScript enabled in your browser.</noscript>
    </main>
  </body>
</html>
